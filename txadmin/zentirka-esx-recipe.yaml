$engine: 3
$onesync: on
name: ZENTRIKA RP - ESX Legacy
author: ZENTRIKA RP
description: Instala ESX Legacy y agrega el paquete de apariencia alojado en el repositorio de ZENTRIKA. Los demas recursos se incorporaran cuando esten publicados en GitHub.

tasks:
  # Recursos base de CFX
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Receta oficial ESX Legacy
  - action: download_github
    src: https://github.com/esx-framework/esx-recipes
    ref: legacy
    dest: ./tmp/recipe

  - action: move_path
    src: ./tmp/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/recipe/esxLogo.png
    dest: ./esxLogo.png

  - action: connect_database

  - action: download_github
    src: https://github.com/esx-framework/esx-core
    ref: main
    dest: ./tmp/core

  - action: query_database
    file: ./tmp/core/[SQL]/legacy.sql

  - action: download_github
    src: https://github.com/esx-framework/ESX-Legacy-Addons
    ref: main
    dest: ./tmp/addons
    timeoutSeconds: 900

  - action: move_path
    src: ./tmp/core/[core]
    dest: ./resources/[core]

  - action: move_path
    src: ./tmp/addons/[esx_addons]
    dest: ./resources/[esx_addons]

  # Recursos independientes
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/pma-voice

  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip

  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip

  - action: download_file
    path: ./tmp/files/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip

  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/ox_lib.zip

  # Apariencia ZENTRIKA desde GitHub
  # El ZIP debe contener la carpeta [apariencia] en su raiz.
  - action: download_file
    url: https://raw.githubusercontent.com/destruction999/servidor/main/%5Bapariencia%5D.zip
    path: ./tmp/files/apariencia.zip

  - action: unzip
    src: ./tmp/files/apariencia.zip
    dest: ./resources

  # Limpieza
  - action: remove_path
    path: ./tmp
